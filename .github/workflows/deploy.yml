name: Build & Deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pics-server:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pics-server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/pics-server:latest

            docker stop pics-server || true
            docker rm pics-server || true

            docker run -d \
              -p 80:10000 \
              --name pics-server \
              --restart always \
              -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              -e SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e S3_MEDIA_BUCKET=${{ secrets.S3_MEDIA_BUCKET }} \
              -e CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }} \
              -e SQS_MEDIA_QUEUE_URL=${{ secrets.SQS_MEDIA_QUEUE_URL }} \
              -e REKOGNITION_COLLECTION_PREFIX=${{ secrets.REKOGNITION_COLLECTION_PREFIX }} \
              -e STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
              -e STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e APP_ENV=production \
              -e CORS_ORIGINS=${{ secrets.CORS_ORIGINS }} \
              -e LOG_LEVEL=INFO \
              ${{ secrets.DOCKER_USERNAME }}/pics-server:latest
