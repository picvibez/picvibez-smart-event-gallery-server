name: Docker CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/pics-server:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pics-server:latest

      # 🔥 ADD THIS BLOCK (EC2 DEPLOY)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/pics-server:latest

            docker stop pics-server || true
            docker rm pics-server || true

            docker run -d \
              -p 80:10000 \
              --name pics-server \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/pics-server:latest